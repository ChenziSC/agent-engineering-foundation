version: 1
entries:
  - task_type: "修改仓库定位或顶层结构"
    start_paths:
      - "README.md"
      - "docs/能力地图.md"
      - "docs/目标仓库设计.md"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "repository-positioning"
      - "deterministic-core-boundary"
      - "public-generalization-policy"
      - "self-hosted-governance"
    exclude_by_default: []
  - task_type: "新增或修改 Skill"
    start_paths:
      - "skills/"
      - "frameworks/skill-eval/README.md"
      - "templates/skill-eval/"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "self-hosted-governance"
      - "deterministic-core-boundary"
      - "public-generalization-policy"
    exclude_by_default: []
  - task_type: "接入存量项目或重建长期上下文候选"
    start_paths:
      - "frameworks/context-contract/"
      - "skills/project-context-bootstrap/"
      - "templates/ai-friendly-repository/"
      - "knowledge/"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "repository-positioning"
      - "deterministic-core-boundary"
      - "self-hosted-governance"
      - "public-generalization-policy"
    exclude_by_default: []
  - task_type: "实现或验证安全变更"
    start_paths:
      - "frameworks/change-validation/"
      - "skills/safe-change/"
      - "packages/harness/"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "repository-positioning"
      - "deterministic-core-boundary"
      - "self-hosted-governance"
    exclude_by_default: []
  - task_type: "实现 Design-to-Code 或埋点治理"
    start_paths:
      - "frameworks/design-to-code/"
      - "frameworks/tracking-governance/"
      - "skills/design-to-code/"
      - "skills/tracking-governance/"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "repository-positioning"
      - "public-generalization-policy"
    exclude_by_default: []
  - task_type: "修改 Specflow、归档或 Knowledge"
    start_paths:
      - "skills/specflow/"
      - "blueprints/specflow/"
      - "specs/"
      - "knowledge/"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "repository-positioning"
      - "deterministic-core-boundary"
      - "self-hosted-governance"
      - "public-generalization-policy"
    exclude_by_default: []
  - task_type: "新增或修改 Adapter"
    start_paths:
      - "adapters/"
      - "blueprints/infrastructure-adapters/"
      - "templates/infrastructure-adapters/"
      - "packages/harness/"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "repository-positioning"
      - "deterministic-core-boundary"
      - "public-generalization-policy"
    exclude_by_default: []
  - task_type: "公开发布或敏感信息检查"
    start_paths:
      - "knowledge/public-generalization-policy.md"
      - "docs/公开发布检查清单.md"
      - "docs/公开内容来源说明.md"
      - "packages/harness/src/harness.mjs"
      - ".github/workflows/quality.yml"
    module_rules:
      - "AGENTS.md"
    knowledge:
      - "repository-positioning"
      - "public-generalization-policy"
    exclude_by_default: []
