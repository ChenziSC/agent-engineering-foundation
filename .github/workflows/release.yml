name: publish-npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在且与 package.json 版本一致的 v<semver> Tag"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: 检出已授权 Tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ inputs.tag }}"
      - name: 配置 Node.js 与公共 npm Registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/"
      - name: 执行 Harness 测试
        run: npm test
      - name: 执行大型治理规模回归
        run: npm run test:scale
      - name: 执行仓库级只读检查
        run: npm run check
      - name: 验证本仓采用状态
        run: node packages/harness/bin/agent-foundation.mjs doctor --target .
      - name: 验证本仓 Skill 分发
        run: node packages/harness/bin/agent-foundation.mjs distribution verify --target .
      - name: 生成不可变包和摘要清单
        run: npm run release:pack -- --target . --output "$RUNNER_TEMP/agent-foundation-release"
      - name: 发布并回读 npm Registry 完整性
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"
        run: node .github/scripts/publish-npm-release.mjs --tag "${{ inputs.tag }}" --release-dir "$RUNNER_TEMP/agent-foundation-release"
