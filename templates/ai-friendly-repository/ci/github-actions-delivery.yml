name: agent-foundation-delivery

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      spec_id:
        description: "本次交付关联的 Spec ID；与 exemption 二选一"
        required: false
        default: ""
        type: string
      exemption:
        description: "无需 Spec 时使用 Change Gate 已支持的豁免；与 spec_id 二选一"
        required: false
        default: ""
        type: string
      required_check:
        description: "必需 Check，格式为 github-actions/check-name@.github/workflows/file.yml"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      base_sha:
        description: "目标分支不可变 40 位 Commit SHA"
        required: true
        type: string
      source_sha:
        description: "交付候选不可变 40 位 Commit SHA"
        required: true
        type: string
      spec_id:
        description: "本次交付关联的 Spec ID；与 exemption 二选一"
        required: false
        default: ""
        type: string
      exemption:
        description: "无需 Spec 时使用 Change Gate 已支持的豁免；与 spec_id 二选一"
        required: false
        default: ""
        type: string
      required_check:
        description: "必需 Check，格式为 github-actions/check-name@.github/workflows/file.yml"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  actions: read

env:
  AGENT_FOUNDATION_PACKAGE: "REPLACE_WITH_EXACT_PACKAGE_SPEC"

jobs:
  delivery-governance:
    runs-on: ubuntu-latest
    steps:
      - name: 检出不可变交付候选
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ inputs.source_sha }}"
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装固定版本 Agent Foundation CLI
        run: test "$AGENT_FOUNDATION_PACKAGE" != "REPLACE_WITH_EXACT_PACKAGE_SPEC" && npm install --global --ignore-scripts --no-audit --no-fund "$AGENT_FOUNDATION_PACKAGE"
      - name: 校验不可变输入
        env:
          BASE_SHA: "${{ inputs.base_sha }}"
          SOURCE_SHA: "${{ inputs.source_sha }}"
          SPEC_ID: "${{ inputs.spec_id }}"
          EXEMPTION: "${{ inputs.exemption }}"
          REQUIRED_CHECK: "${{ inputs.required_check }}"
        run: test "${#BASE_SHA}" -eq 40 && test -z "${BASE_SHA//[0-9a-f]/}" && test "${#SOURCE_SHA}" -eq 40 && test -z "${SOURCE_SHA//[0-9a-f]/}" && { test -n "$SPEC_ID" || test -n "$EXEMPTION"; } && { test -z "$SPEC_ID" || test -z "$EXEMPTION"; } && test -n "$REQUIRED_CHECK" && git cat-file -e "$BASE_SHA^{commit}" && git cat-file -e "$SOURCE_SHA^{commit}"
      - name: 检查项目结构和受管 Skill
        run: agent-foundation doctor
      - name: 检查长期知识
        run: agent-foundation knowledge check
      - name: 检查 Specflow
        run: agent-foundation specflow check
      - name: 验证运行时 Skill 分发
        run: agent-foundation distribution verify
      - name: 运行交付门禁
        env:
          BASE_SHA: "${{ inputs.base_sha }}"
          SOURCE_SHA: "${{ inputs.source_sha }}"
          SPEC_ID: "${{ inputs.spec_id }}"
          EXEMPTION: "${{ inputs.exemption }}"
          REQUIRED_CHECK: "${{ inputs.required_check }}"
          GITHUB_TOKEN: "${{ github.token }}"
        run: if test -n "$SPEC_ID"; then association_args=(--spec-id "$SPEC_ID"); else association_args=(--exemption "$EXEMPTION"); fi; agent-foundation change gate check --base "$BASE_SHA" --source "$SOURCE_SHA" "${association_args[@]}" --phase delivery --required-check "$REQUIRED_CHECK"
      - name: 确认检查没有改写项目
        if: always()
        run: git diff --exit-code
